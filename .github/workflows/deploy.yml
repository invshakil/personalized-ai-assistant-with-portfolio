name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Verify — lint, format check, TypeScript.
  # Runs on every push to main AND on every PR targeting main.
  # No env vars needed — these checks are pure static analysis.
  # ─────────────────────────────────────────────────────────────
  verify:
    name: Lint · Format · Types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: TypeScript check
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────────────────────
  # Job 2: Deploy — SSH into the DigitalOcean droplet.
  # The server already has .env.local with all real credentials,
  # so build and migrate run there with zero secrets in GitHub
  # beyond the SSH key itself.
  # Only runs on push to main (never on PRs).
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to DigitalOcean
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            export PATH=/usr/local/bin:/usr/bin:/bin:$PATH
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd ${{ secrets.DEPLOY_PATH }}

            echo "==> Pulling latest code"
            git pull origin main

            echo "==> Installing dependencies"
            npm ci

            echo "==> Running database migrations"
            npx prisma migrate deploy

            echo "==> Building for production"
            npm run build

            echo "==> Restarting application"
            pm2 restart sshakil --update-env || pm2 start npm --name "sshakil" -- start
            pm2 save

            echo "==> Deploy complete"

name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Verify — lint, format, types, build
  # Runs on every push to main AND on every PR targeting main.
  # ─────────────────────────────────────────────────────────────
  verify:
    name: Lint · Format · Types · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
        env:
          # Prisma needs a valid DATABASE_URL to generate the client.
          # The CI build does not connect to the DB; a well-formed URL is enough.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_URL: ${{ secrets.AUTH_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_CV_URL: ${{ secrets.NEXT_PUBLIC_CV_URL }}

  # ─────────────────────────────────────────────────────────────
  # Job 2: Deploy — SSH into the DigitalOcean droplet,
  # pull latest code, migrate, rebuild, restart PM2.
  # Only runs on push to main (not on PRs).
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to DigitalOcean
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # Every command runs as a single session on the server.
          # `set -e` stops on first failure so PM2 is never restarted
          # with a broken build.
          script: |
            set -e

            cd ${{ secrets.DEPLOY_PATH }}

            echo "==> Pulling latest code"
            git pull origin main

            echo "==> Installing dependencies"
            npm ci

            echo "==> Running database migrations"
            npx prisma migrate deploy

            echo "==> Building for production"
            npm run build

            echo "==> Restarting PM2 process"
            pm2 restart sshakil --update-env || pm2 start npm --name "sshakil" -- start

            echo "==> Saving PM2 process list"
            pm2 save

            echo "==> Done. Deploy complete."
